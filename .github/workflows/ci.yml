name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # `tsc --noEmit` does not read Svelte templates, and neither does the
      # build: a console calling a method that no longer exists compiles
      # cleanly and fails at runtime. This is the step that reads them.
      - run: npm run check

      - run: npm test

      - run: npm run build

      # Concept §8.4: the cause graph is data, so it is checked mechanically
      # on every change to src/data/causes.json.
      - run: npm run lint:graph
